<style>
body{margin:0}
.fl{animation:fl 0.6s ease-out 0.1s infinite both}
@keyframes fl{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-16px);opacity:0}}
.bump{display:inline-block;transform-origin:50% 60%;animation:bump 0.6s ease-out 0.1s infinite}
@keyframes bump{0%,100%{transform:scale(1)}20%{transform:scale(1.15)}}
@media (prefers-reduced-motion: reduce){.fl{animation:none;opacity:0}.bump{animation:none}}
.av{display:block;flex-shrink:0;transform-origin:50% 100%}
.act{animation-name:hop;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
@keyframes hop{0%,100%{transform:translateY(0) scale(1.1,0.88)}20%{transform:translateY(0) scale(0.94,1.08)}50%{transform:translateY(calc(var(--h) * -1)) scale(1,1)}80%{transform:translateY(0) scale(0.94,1.08)}}
.summon{transform-origin:50% 100%;animation:summon 7s linear infinite;filter:drop-shadow(0 0 5px #FFFFFF)}
@keyframes summon{0%{transform:translateY(-130px) scale(1,1);opacity:0}6%{transform:translateY(-124px) scale(1,1);opacity:1}56%{transform:translateY(0) scale(1,1);opacity:1}59%{transform:translateY(0) scale(1.12,0.86);opacity:1}64%{transform:translateY(0) scale(1,1);opacity:1}92%{transform:translateY(0) scale(1,1);opacity:1}97%,100%{transform:translateY(0) scale(1,1);opacity:0}}
.beam{animation:beam 7s linear infinite}
@keyframes beam{0%,4%{opacity:0}10%{opacity:1}52%{opacity:1}62%,100%{opacity:0}}
.spk{transform-origin:50% 50%;animation:twinkle 0.9s ease-in-out infinite}
@keyframes twinkle{0%,100%{transform:scale(0.4);opacity:0.2}50%{transform:scale(1.1);opacity:1}}
.pop{transform-origin:50% 0%;animation:pop 7s linear infinite}
@keyframes pop{0%,8%{transform:scale(0.3);opacity:0}13%{transform:scale(1.12);opacity:1}16%{transform:scale(1);opacity:1}80%{transform:scale(1);opacity:1}88%,100%{transform:scale(1);opacity:0}}
.tgt{animation:tgt 7s ease-out infinite}
@keyframes tgt{0%,7%{transform:translateY(6px)}22%,100%{transform:translateY(0)}}
@media (prefers-reduced-motion: reduce){.act{animation:none;filter:drop-shadow(0 0 3px #FF3B5C)}.summon,.beam,.spk,.pop,.tgt{animation:none}.summon{transform:none;opacity:1}.beam{opacity:0.6}.spk{transform:none;opacity:1}.pop{transform:none;opacity:1}}
</style>
