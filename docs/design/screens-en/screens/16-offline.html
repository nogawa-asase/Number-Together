<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline</title>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
.dot{animation:dot 1.2s ease-in-out infinite}
.dot2{animation-delay:0.2s}
.dot3{animation-delay:0.4s}
@keyframes dot{0%,100%{transform:translateY(0);opacity:0.4}50%{transform:translateY(-6px);opacity:1}}
.wob{animation:wob 2.4s ease-in-out infinite;transform-origin:50% 100%}
@keyframes wob{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@media (prefers-reduced-motion: reduce){.dot,.wob{animation:none}}
</style>
<style>
body{background:#E6E6E6;display:flex;justify-content:center}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #FFE45E; color: #111111; font-family: 'M PLUS Rounded 1c', sans-serif; padding: 20px; display: flex; flex-direction: column; gap: 14px">
  <button style="position: absolute; top: 2px; right: 10px; z-index: 100; height: 17px; box-sizing: border-box; padding: 0 9px; border: 2px solid #111111; border-radius: 999px; background: #FFFFFF; color: #111111; font-family: 'M PLUS Rounded 1c', sans-serif; font-size: 10px; line-height: 13px; font-weight: 800; cursor: pointer">日本語</button>
  <div style="padding: 24px 4px 0 4px">
    <div style="font-family: 'Dela Gothic One', sans-serif; font-size: 32px; line-height: 40px">No connection…</div>
    <div style="font-size: 14px; line-height: 20px; font-weight: 800">Try somewhere with a better signal</div>
  </div>

  <div style="background: #FFFFFF; border: 4px solid #111111; border-radius: 20px; box-shadow: 6px 6px 0 #111111; padding: 18px 14px; display: flex; flex-direction: column; align-items: center; gap: 12px">
    <div class="wob" style="width: 120px; height: 120px; box-sizing: border-box; border: 4px solid #111111; border-radius: 50%; background: #FFF8D6; display: flex; align-items: center; justify-content: center">
      <svg viewBox="0 0 64 64" style="display: block; width: 76px; height: 76px" fill="none" stroke="#111111" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M8 26 Q32 6 56 26"></path>
        <path d="M17 36 Q32 24 47 36"></path>
        <path d="M26 46 Q32 41 38 46"></path>
        <circle cx="32" cy="54" r="2.5" fill="#111111"></circle>
        <path d="M10 8 L54 58" stroke="#FF3B5C" stroke-width="6"></path>
      </svg>
    </div>
    <div style="font-size: 16px; line-height: 22px; font-weight: 800">Reconnecting</div>
    <div style="display: flex; align-items: center; gap: 8px">
      <div class="dot" style="width: 12px; height: 12px; border-radius: 50%; background: #111111"></div>
      <div class="dot dot2" style="width: 12px; height: 12px; border-radius: 50%; background: #111111"></div>
      <div class="dot dot3" style="width: 12px; height: 12px; border-radius: 50%; background: #111111"></div>
    </div>
    <div style="font-size: 12px; line-height: 16px; font-weight: 800; color: #5B6577">Attempt 3</div>
  </div>

  <div style="background: #FFF8D6; border: 3px solid #111111; border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px">
    <div style="display: flex; align-items: flex-start; gap: 8px">
      <div style="width: 8px; height: 8px; border-radius: 50%; background: #111111; margin-top: 7px; flex-shrink: 0"></div>
      <div style="font-size: 13px; line-height: 22px; font-weight: 800">Once connected, you can rejoin<br>(until the last minute)</div>
    </div>
    <div style="display: flex; align-items: flex-start; gap: 8px">
      <div style="width: 8px; height: 8px; border-radius: 50%; background: #111111; margin-top: 7px; flex-shrink: 0"></div>
      <div style="font-size: 13px; line-height: 22px; font-weight: 800">If you're offline for over a minute, you'll join the next round</div>
    </div>
  </div>

  <div style="flex-grow: 1"></div>
  <button style="flex-shrink: 0; height: 64px; border: 4px solid #111111; background: #FF5C8A; color: #111111; border-radius: 20px; box-shadow: 5px 5px 0 #111111; font-family: 'Dela Gothic One', sans-serif; font-size: 22px; cursor: pointer">Retry now</button>
</div>
</body>
</html>
