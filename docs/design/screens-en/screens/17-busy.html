<style>
body{margin:0}
.jig{animation:jig 0.9s ease-in-out infinite}
.jig2{animation-delay:0.2s}
.jig3{animation-delay:0.5s}
@keyframes jig{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.bar{animation:bar 10s linear infinite}
@keyframes bar{0%{width:100%}100%{width:0%}}
@media (prefers-reduced-motion: reduce){.jig,.bar{animation:none}.bar{width:60%}}
</style>
<style>
body{background:#E6E6E6;display:flex;justify-content:center}
</style>
</head>

    <div style="font-size: 16px; line-height: 22px; font-weight: 800; text-align: center">Please wait a bit and try again</div>
    <div style="width: 100%; display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; align-items: baseline; justify-content: space-between">
        <div style="font-size: 12px; line-height: 16px; font-weight: 800; color: #5B6577">Retrying automatically</div>
        <div style="font-family: 'Dela Gothic One', sans-serif; font-size: 16px; line-height: 20px">10s</div>
      </div>
      <div style="height: 14px; box-sizing: border-box; border: 3px solid #111111; border-radius: 999px; background: #FFF8D6; overflow: hidden">
        <div class="bar" style="height: 100%; background: #FF5C8A"></div>
      </div>
    </div>
  </div>

  <div style="flex-grow: 1"></div>
  <button style="flex-shrink: 0; height: 64px; border: 4px solid #111111; background: #FF5C8A; color: #111111; border-radius: 20px; box-shadow: 5px 5px 0 #111111; font-family: 'Dela Gothic One', sans-serif; font-size: 22px; cursor: pointer">Try now</button>

</html>
