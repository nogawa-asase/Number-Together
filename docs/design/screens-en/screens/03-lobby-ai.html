<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gathering (AIs join)</title>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
.bob{animation:bob 1.8s ease-in-out infinite;transform-origin:50% 100%}
.b2{animation-delay:0.4s}
.b3{animation-delay:0.9s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.land{animation:land 3s ease-out infinite both}
.l2{animation-delay:0.5s}
.l3{animation-delay:1s}
@keyframes land{0%{opacity:0}30%{opacity:1}100%{opacity:1}}
@media (prefers-reduced-motion: reduce){.bob,.land{animation:none}.land{opacity:1}}
</style>
<style>
body{background:#E6E6E6;display:flex;justify-content:center}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #FFE45E; color: #111111; font-family: 'M PLUS Rounded 1c', sans-serif; padding: 20px; display: flex; flex-direction: column; gap: 10px">
  <button style="position: absolute; top: 2px; right: 10px; z-index: 100; height: 17px; box-sizing: border-box; padding: 0 9px; border: 2px solid #111111; border-radius: 999px; background: #FFFFFF; color: #111111; font-family: 'M PLUS Rounded 1c', sans-serif; font-size: 10px; line-height: 13px; font-weight: 800; cursor: pointer">日本語</button>
  <div style="background: #FFFFFF; border: 4px solid #111111; border-radius: 20px; box-shadow: 6px 6px 0 #111111; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 8px">
      <div style="display: flex; flex-direction: column; gap: 0">
        <div style="font-size: 13px; line-height: 18px; font-weight: 800">Next round in</div>
        <div style="display: flex; align-items: baseline; gap: 6px">
          <span style="font-size: 20px; font-weight: 800"></span>
          <span style="font-family: 'Dela Gothic One', sans-serif; font-size: 46px; line-height: 1">3</span>
          <span style="font-size: 20px; font-weight: 800">s</span>
        </div>
      </div>
      <div style="background: #111111; color: #FFFFFF; border-radius: 999px; padding: 2px 12px; font-size: 13px; line-height: 18px; font-weight: 800; margin-bottom: 6px">Gathering</div>
    </div>
    <div style="height: 16px; box-sizing: border-box; border: 3px solid #111111; border-radius: 999px; background: #FFF8D6; overflow: hidden">
      <div style="width: 10%; height: 100%; background: #FF5C8A"></div>
    </div>
  </div>

  <div style="background: #FFFFFF; border: 4px solid #111111; border-radius: 20px; box-shadow: 6px 6px 0 #111111; padding: 12px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: baseline; justify-content: space-between">
      <div style="font-size: 14px; line-height: 20px; font-weight: 800">Players</div>
      <div style="font-family: 'Dela Gothic One', sans-serif; font-size: 18px; line-height: 22px">5 <span style="font-family: 'M PLUS Rounded 1c', sans-serif; font-size: 12px; font-weight: 800">/ 20 players</span></div>
    </div>
    <div style="background: #111111; color: #FFFFFF; border-radius: 12px; padding: 8px 12px; display: flex; align-items: center; gap: 8px">
      <svg viewBox="0 0 28 40" style="display: block; width: 18px; height: 26px; flex-shrink: 0"><line x1="14" y1="6" x2="14" y2="2" stroke="#FFFFFF" stroke-width="2.5"></line><circle cx="14" cy="2.5" r="2.4" fill="#FF3B5C" stroke="#FFFFFF" stroke-width="1.5"></circle><rect x="4" y="6" width="20" height="14" rx="4" fill="#9DB4C0" stroke="#FFFFFF" stroke-width="2"></rect><rect x="8" y="11" width="4" height="4" fill="#111111"></rect><rect x="16" y="11" width="4" height="4" fill="#111111"></rect><rect x="6" y="21" width="16" height="15" rx="3" fill="#9DB4C0" stroke="#FFFFFF" stroke-width="2"></rect></svg>
      <div style="font-size: 13px; line-height: 18px; font-weight: 800">Few players, so 3 AIs are joining</div>
    </div>
    <div style="display: flex; gap: 8px">
      <div class="cell" style="flex: 1; min-width: 0; box-sizing: border-box; border: 3px solid #FF3B5C; border-radius: 14px; background: #FFE4EA; padding: 6px 2px; display: flex; flex-direction: column; align-items: center; gap: 3px">
        <svg class="bob" viewBox="0 0 22 32" style="display: block; width: 32px; height: 46px"><circle cx="18.6" cy="15" r="3" fill="#D94F30" stroke="#111111" stroke-width="1.5"></circle><path d="M4 31 V25.5 Q4 19.5 11 19.5 Q18 19.5 18 25.5 V31 Z" fill="#FF5C8A" stroke="#111111" stroke-width="2" stroke-linejoin="round"></path><circle cx="11" cy="11.5" r="7" fill="#FFD9B8" stroke="#111111" stroke-width="2"></circle><circle cx="8.6" cy="12" r="1" fill="#111111"></circle><circle cx="13.4" cy="12" r="1" fill="#111111"></circle><path d="M4 11 Q4 4 11 4 Q18 4 18 11 Q15.5 8 11 8.2 Q6.5 8 4 11 Z" fill="#D94F30" stroke="#111111" stroke-width="1.5" stroke-linejoin="round"></path></svg>
        <div style="font-size: 11px; line-height: 14px; font-weight: 800; white-space: nowrap">Taro</div>
        <div style="background: #D5DCE4; border-radius: 999px; padding: 0 6px; font-size: 10px; line-height: 13px; font-weight: 800; white-space: nowrap">Regular</div>
      </div>
      <div class="cell" style="flex: 1; min-width: 0; box-sizing: border-box; border: 3px solid #111111; border-radius: 14px; background: #FFF8D6; padding: 6px 2px; display: flex; flex-direction: column; align-items: center; gap: 3px">
        <svg class="bob b2" viewBox="0 0 22 32" style="display: block; width: 32px; height: 46px"><path d="M4 31 V25.5 Q4 19.5 11 19.5 Q18 19.5 18 25.5 V31 Z" fill="#2EC27E" stroke="#111111" stroke-width="2" stroke-linejoin="round"></path><circle cx="11" cy="11.5" r="7" fill="#E8B58A" stroke="#111111" stroke-width="2"></circle><circle cx="8.6" cy="12" r="1" fill="#111111"></circle><circle cx="13.4" cy="12" r="1" fill="#111111"></circle><path d="M5.5 18.8 H16.5 V22.5 H5.5 Z" fill="#FF5C8A" stroke="#111111" stroke-width="1.5" stroke-linejoin="round"></path><rect x="13" y="21.5" width="3.2" height="5.5" fill="#FF5C8A" stroke="#111111" stroke-width="1.2"></rect></svg>
        <div style="font-size: 11px; line-height: 14px; font-weight: 800; white-space: nowrap">Yuki</div>
        <div style="background: #FFFFFF; border: 1.5px dashed #111111; border-radius: 999px; padding: 0 5px; font-size: 10px; line-height: 12px; font-weight: 800; white-space: nowrap">Rookie</div>
      </div>
      <div class="cell land" style="flex: 1; min-width: 0; box-sizing: border-box; border: 3px dashed #111111; border-radius: 14px; background: #E8EEF2; padding: 6px 2px; display: flex; flex-direction: column; align-items: center; gap: 3px">
        <svg class="bob b3" viewBox="0 0 28 40" style="display: block; width: 32px; height: 46px"><line x1="14" y1="6" x2="14" y2="2" stroke="#111111" stroke-width="2"></line><circle cx="14" cy="2.5" r="2" fill="#FF3B5C" stroke="#111111" stroke-width="1.5"></circle><rect x="4" y="6" width="20" height="14" rx="4" fill="#9DB4C0" stroke="#111111" stroke-width="2"></rect><rect x="8" y="11" width="4" height="4" fill="#111111"></rect><rect x="16" y="11" width="4" height="4" fill="#111111"></rect><rect x="6" y="21" width="16" height="15" rx="3" fill="#9DB4C0" stroke="#111111" stroke-width="2"></rect><circle cx="14" cy="28" r="2.8" fill="#FF3B5C" stroke="#111111" stroke-width="1.5"></circle><rect x="8" y="36" width="5" height="3" fill="#111111"></rect><rect x="15" y="36" width="5" height="3" fill="#111111"></rect></svg>
        <div style="font-size: 10px; line-height: 14px; font-weight: 800; white-space: nowrap">Grabby AI</div>
        <div style="background: #111111; color: #FFFFFF; border-radius: 999px; padding: 0 6px; font-size: 10px; line-height: 13px; font-weight: 800; white-space: nowrap">AI</div>
      </div>
      <div class="cell land l2" style="flex: 1; min-width: 0; box-sizing: border-box; border: 3px dashed #111111; border-radius: 14px; background: #E8EEF2; padding: 6px 2px; display: flex; flex-direction: column; align-items: center; gap: 3px">
        <svg class="bob" viewBox="0 0 28 40" style="display: block; width: 32px; height: 46px"><line x1="14" y1="6" x2="14" y2="2" stroke="#111111" stroke-width="2"></line><circle cx="14" cy="2.5" r="2" fill="#3A86FF" stroke="#111111" stroke-width="1.5"></circle><rect x="4" y="6" width="20" height="14" rx="4" fill="#9DB4C0" stroke="#111111" stroke-width="2"></rect><rect x="8" y="11" width="4" height="4" fill="#111111"></rect><rect x="16" y="11" width="4" height="4" fill="#111111"></rect><rect x="6" y="21" width="16" height="15" rx="3" fill="#9DB4C0" stroke="#111111" stroke-width="2"></rect><circle cx="14" cy="28" r="2.8" fill="#3A86FF" stroke="#111111" stroke-width="1.5"></circle><rect x="8" y="36" width="5" height="3" fill="#111111"></rect><rect x="15" y="36" width="5" height="3" fill="#111111"></rect></svg>
        <div style="font-size: 10px; line-height: 14px; font-weight: 800; white-space: nowrap">Moody AI</div>
        <div style="background: #111111; color: #FFFFFF; border-radius: 999px; padding: 0 6px; font-size: 10px; line-height: 13px; font-weight: 800; white-space: nowrap">AI</div>
      </div>
      <div class="cell land l3" style="flex: 1; min-width: 0; box-sizing: border-box; border: 3px dashed #111111; border-radius: 14px; background: #E8EEF2; padding: 6px 2px; display: flex; flex-direction: column; align-items: center; gap: 3px">
        <svg class="bob b2" viewBox="0 0 28 40" style="display: block; width: 32px; height: 46px"><line x1="14" y1="6" x2="14" y2="2" stroke="#111111" stroke-width="2"></line><circle cx="14" cy="2.5" r="2" fill="#2EC27E" stroke="#111111" stroke-width="1.5"></circle><rect x="4" y="6" width="20" height="14" rx="4" fill="#9DB4C0" stroke="#111111" stroke-width="2"></rect><rect x="8" y="11" width="4" height="4" fill="#111111"></rect><rect x="16" y="11" width="4" height="4" fill="#111111"></rect><rect x="6" y="21" width="16" height="15" rx="3" fill="#9DB4C0" stroke="#111111" stroke-width="2"></rect><circle cx="14" cy="28" r="2.8" fill="#2EC27E" stroke="#111111" stroke-width="1.5"></circle><rect x="8" y="36" width="5" height="3" fill="#111111"></rect><rect x="15" y="36" width="5" height="3" fill="#111111"></rect></svg>
        <div style="font-size: 10px; line-height: 14px; font-weight: 800; white-space: nowrap">Balancer AI</div>
        <div style="background: #111111; color: #FFFFFF; border-radius: 999px; padding: 0 6px; font-size: 10px; line-height: 13px; font-weight: 800; white-space: nowrap">AI</div>
      </div>
    </div>
    <div style="text-align: center; font-size: 12px; line-height: 16px; font-weight: 800; color: #5B6577">15 seats open</div>
  </div>

  <div style="background: #FFFFFF; border: 4px solid #111111; border-radius: 20px; box-shadow: 6px 6px 0 #111111; padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px">
    <div style="display: flex; flex-direction: column; gap: 0">
      <div style="font-size: 13px; line-height: 18px; font-weight: 800">Target</div>
      <div style="font-family: 'Dela Gothic One', sans-serif; font-size: 32px; line-height: 38px">1,000</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px; text-align: right">
      <div style="font-size: 13px; line-height: 18px; font-weight: 800">5 players × 200</div>
      <div style="font-size: 12px; line-height: 16px; font-weight: 800">Success: 900 – 1,100</div>
      <div style="font-size: 11px; line-height: 15px; font-weight: 800; color: #5B6577">AIs count as players</div>
    </div>
  </div>
  <div style="text-align: center; font-size: 12px; line-height: 16px; font-weight: 800">Use +1 and −1 to hit the target together</div>
</div>
</body>
</html>
