<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Waiting (almost over)</title>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
.dot{animation:dot 1.2s ease-in-out infinite}
.dot2{animation-delay:0.2s}
.dot3{animation-delay:0.4s}
@keyframes dot{0%,100%{transform:translateY(0);opacity:0.4}50%{transform:translateY(-6px);opacity:1}}
@media (prefers-reduced-motion: reduce){.dot{animation:none}}
</style>
<style>
body{background:#E6E6E6;display:flex;justify-content:center}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #FFE45E; color: #111111; font-family: 'M PLUS Rounded 1c', sans-serif; padding: 20px; display: flex; flex-direction: column; gap: 14px">
  <button style="position: absolute; top: 2px; right: 10px; z-index: 100; height: 17px; box-sizing: border-box; padding: 0 9px; border: 2px solid #111111; border-radius: 999px; background: #FFFFFF; color: #111111; font-family: 'M PLUS Rounded 1c', sans-serif; font-size: 10px; line-height: 13px; font-weight: 800; cursor: pointer">日本語</button>
  <div style="padding: 24px 4px 0 4px">
    <div style="font-family: 'Dela Gothic One', sans-serif; font-size: 32px; line-height: 40px">Almost over</div>
    <div style="font-size: 14px; line-height: 20px; font-weight: 800">No joining in the last minute</div>
  </div>

  <div style="background: #111111; color: #FFFFFF; border: 4px solid #111111; border-radius: 20px; box-shadow: 6px 6px 0 #FF3B5C; padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 6px">
    <div style="font-size: 14px; line-height: 20px; font-weight: 800">Next round in</div>
    <div style="font-family: 'Dela Gothic One', sans-serif; font-size: 56px; line-height: 64px; color: #FFE45E">1:18</div>
    <div style="width: 100%; box-sizing: border-box; height: 12px; border-radius: 999px; background: rgba(255,255,255,0.3); overflow: hidden">
      <div style="width: 60%; height: 100%; background: #FFE45E"></div>
    </div>
    <div style="font-size: 12px; line-height: 16px; font-weight: 800; margin-top: 4px">You'll join as soon as the next round starts</div>
  </div>

  <div style="display: flex; align-items: center; justify-content: center; gap: 8px; padding-top: 6px">
    <div class="dot" style="width: 12px; height: 12px; border-radius: 50%; background: #111111"></div>
    <div class="dot dot2" style="width: 12px; height: 12px; border-radius: 50%; background: #111111"></div>
    <div class="dot dot3" style="width: 12px; height: 12px; border-radius: 50%; background: #111111"></div>
    <div style="font-size: 13px; line-height: 18px; font-weight: 800; margin-left: 4px">Waiting</div>
  </div>

  <div style="flex-grow: 1"></div>
</div>
</body>
</html>
